name: SEO build validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "seo/**"]

permissions:
  contents: read

jobs:
  build-and-seo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Validate SEO output
        run: npm run check:seo
