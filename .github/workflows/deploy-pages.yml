name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "5 3 * * *" # 10:05 WIB, rebuild konten terjadwal
    - cron: "35 3 * * *" # 10:35 WIB, cadangan jika run pertama tertunda

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache imported media
        uses: actions/cache@v4
        with:
          path: public/wp-content/uploads
          key: wordpress-media-v1
      - name: Import WordPress media
        run: python scripts/import-wordpress-media.py
      - name: Optimize media for Pages
        run: |
          python -m pip install Pillow
          python scripts/optimize-media.py
      - name: Build
        env:
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
        run: npm run build
      - name: Verify publication and SEO output
        run: npm run check:seo
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
